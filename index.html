
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مجمع التلاوات الحضاري</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-emerald: #022c22;
            --royal-gold: #c5a059;
            --soft-cream: #fdfaf3;
        }
        body {
            font-family: 'Amiri', serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #022c22 0%, #064e3b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            margin: 0;
            color: var(--soft-cream);
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M50 0 L60 40 L100 50 L60 60 L50 100 L40 60 L0 50 L40 40 Z' fill='%23c5a059' fill-opacity='0.05'/%3E%3C/svg%3E");
            z-index: -1;
        }
        .main-card {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 40px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            margin-top: 10px;
        }
        .main-card::after {
            content: "";
            position: absolute;
            inset: 12px;
            border: 1px solid rgba(197, 160, 89, 0.15);
            border-radius: 30px;
            pointer-events: none;
        }
        .header-title {
            font-size: 2.8rem;
            background: linear-gradient(to bottom, #fdfaf3, #c5a059);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            font-weight: 700;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
            position: relative;
        }
        .form-label {
            display: block;
            font-size: 1.1rem;
            color: var(--royal-gold);
            margin-bottom: 6px;
            margin-right: 10px;
        }
        select {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(197, 160, 89, 0.3);
            border-radius: 12px;
            padding: 0 15px;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            appearance: none;
            height: 48px;
        }
        select option {
            background: #022c22;
            color: #fff;
        }
        select:focus {
            border-color: var(--royal-gold);
            background: rgba(197, 160, 89, 0.1);
        }
        .btn-generate {
            width: 100%;
            background: linear-gradient(45deg, #c5a059, #e2c28a);
            color: #022c22;
            font-weight: 700;
            padding: 15px;
            border-radius: 15px;
            font-size: 1.2rem;
            margin-top: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            border: none;
        }
        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(197, 160, 89, 0.3);
        }
        audio {
            width: 100%;
            margin-top: 25px;
            filter: sepia(100%) saturate(200%) hue-rotate(5deg) invert(90%);
        }
        .status-indicator {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: var(--royal-gold);
            font-size: 1.1rem;
        }
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: var(--royal-gold);
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="text-center mb-6">
            <h1 class="header-title">مجمع التلاوات</h1>
            <div class="w-16 h-1 bg-royal-gold mx-auto mb-2 opacity-50 rounded-full"></div>
            <p class="text-sm tracking-widest opacity-70">توليد ملفات صوتية للآيات الكريمة</p>
        </div>

        <div class="form-group">
            <label class="form-label">القارئ المفضل</label>
            <select id="reciterSelect"></select>
        </div>

        <div class="form-group">
            <label class="form-label">السورة الكريمة</label>
            <select id="surahSelect"></select>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="form-group">
                <label class="form-label">من الآية</label>
                <select id="startAyah"></select>
            </div>
            <div class="form-group">
                <label class="form-label">إلى الآية</label>
                <select id="endAyah"></select>
            </div>
        </div>

        <button id="mergeBtn" class="btn-generate">توليد المقطع الصوتي</button>

        <div id="statusBox" class="status-indicator">
            <span>جاري معالجة الآيات... <span id="progressPercent">0%</span></span>
            <div class="progress-bar-container">
                <div id="progressFill" class="progress-bar-fill"></div>
            </div>
        </div>

        <div id="playerBox" class="hidden">
            <audio id="mainAudio" controls></audio>
        </div>
    </div>

    <script>
        const reciters = [
            { id: "Yasser_Ad-Dussary_128kbps", name: "ياسر الدوسري" },
            { id: "MaherAlMuaiqly128kbps", name: "ماهر المعيقلي" },
            { id: "Abu%20Bakr%20Ash-Shaatree_128kbps", name: "أبوبكر الشاطري" },
            { id: "Ahmed_ibn_Ali_al-Ajamy_128kbps_ketaballah.net", name: "أحمد العجمي" },
            { id: "Abdul_Basit_Murattal_192kbps", name: "عبد الباسط عبد الصمد" },
            { id: "Abdurrahmaan_As-Sudais_192kbps", name: "عبد الرحمن السديس" },
            { id: "Fares_Abbad_64kbps", name: "فارس عباد" },
            { id: "Husary_128kbps", name: "محمود خليل الحصري" },
            { id: "Minshawy_Murattal_128kbps", name: "محمد صديق المنشاوي" },
            { id: "Alafasy_128kbps", name: "مشاري العفاسي" },
            { id: "Ibrahim_Akhdar_32kbps", name: "إبراهيم الأخضر" },
            { id: "Saood_ash-Shuraym_128kbps", name: "سعود الشريم" },
            { id: "Ali_Jaber_64kbps", name: "علي جابر" },
            { id: "Mohammad_al_Tablaway_128kbps", name: "محمد محمود الطبلاوي" },
            { id: "Sahl_Yassin_128kbps", name: "سهل ياسين" },
            { id: "Salaah_Abdul_Rahman_Bukhatir_128kbps", name: "صلاح بو خاطر" },
            { id: "Salah_Al_Budair_128kbps", name: "صلاح البدير" },
            { id: "Saad_al-Ghamidi_64kbps", name: "سعد الغامدي" },
            { id: "Nasser_Alqatami_128kbps", name: "ناصر القطامي" },
            { id: "Kahlifa_al_Tunaiji_64kbps", name: "خليفة الطنيجي" },
            { id: "Hani_Rifai_192kbps", name: "هاني الرفاعي" },
            { id: "Abdul_Basit_Mujawwad_128kbps", name: "عبد الباسط (مجود)" },
            { id: "Minshawy_Mujawwad_128kbps", name: "المنشاوي (مجود)" },
            { id: "Husary_Mujawwad_64kbps", name: "الحصري (مجود)" },
            { id: "Abdullah_Basfar_192kbps", name: "عبد الله بصفر" },
            { id: "Abdullah_Matroud_128kbps", name: "عبد الله المطرود" },
            { id: "Akram_AlAlaqmy_128kbps", name: "أكرم العلاقمي" },
            { id: "Ghamadi_40kbps", name: "سعد الغامدي (نسخة 2)" },
            { id: "Ali_Hafiz_128kbps", name: "علي الحذيفي" },
            { id: "Mahmoud_Ali_Al_Banna_32kbps", name: "محمود علي البنا" },
            { id: "Ayman_Sowaid_64kbps", name: "أيمن رشدي سويد" }
        ];

        const surahSelect = document.getElementById('surahSelect');
        const startSelect = document.getElementById('startAyah');
        const endSelect = document.getElementById('endAyah');
        const reciterSelect = document.getElementById('reciterSelect');
        const mergeBtn = document.getElementById('mergeBtn');
        const statusBox = document.getElementById('statusBox');
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const playerBox = document.getElementById('playerBox');
        const mainAudio = document.getElementById('mainAudio');

        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        async function init() {
            const prioritizedId = "Yasser_Ad-Dussary_128kbps";
            const prioritizedReciter = reciters.find(r => r.id === prioritizedId);
            const otherReciters = reciters.filter(r => r.id !== prioritizedId)
                                          .sort((a, b) => a.name.localeCompare(b.name, 'ar'));
            
            const sortedReciters = [prioritizedReciter, ...otherReciters];

            sortedReciters.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r.id;
                opt.textContent = r.name;
                reciterSelect.appendChild(opt);
            });

            const res = await fetch('https://api.alquran.cloud/v1/surah');
            const data = await res.json();
            data.data.forEach((s) => {
                const opt = document.createElement('option');
                opt.value = s.number;
                opt.textContent = `${s.number}. ${s.name}`;
                opt.dataset.max = s.numberOfAyahs;
                surahSelect.appendChild(opt);
            });
            
            updateStartAyahList();
            surahSelect.onchange = updateStartAyahList;
            startSelect.onchange = updateEndAyahList;
        }

        function updateStartAyahList() {
            const max = parseInt(surahSelect.options[surahSelect.selectedIndex].dataset.max);
            startSelect.innerHTML = '';
            for (let i = 1; i <= max; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i;
                startSelect.appendChild(opt);
            }
            updateEndAyahList();
        }

        function updateEndAyahList() {
            const max = parseInt(surahSelect.options[surahSelect.selectedIndex].dataset.max);
            const startVal = parseInt(startSelect.value) || 1;
            endSelect.innerHTML = '';
            for (let i = startVal; i <= max; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i;
                endSelect.appendChild(opt);
            }
            endSelect.value = startVal; 
        }

        function getAudioUrl(reciter, surah, ayah) {
            const s = surah.toString().padStart(3, '0');
            const a = ayah.toString().padStart(3, '0');
            return `https://www.everyayah.com/data/${reciter}/${s}${a}.mp3`;
        }

        mergeBtn.onclick = async () => {
            const surah = surahSelect.value;
            const start = parseInt(startSelect.value);
            const end = parseInt(endSelect.value);
            const reciter = reciterSelect.value;

            mergeBtn.disabled = true;
            statusBox.style.display = 'block';
            playerBox.classList.add('hidden');
            let buffers = [];

            try {
                for (let i = start; i <= end; i++) {
                    const url = getAudioUrl(reciter, surah, i);
                    const percent = Math.floor(((i - start + 1) / (end - start + 1)) * 100);
                    progressPercent.textContent = percent + '%';
                    progressFill.style.width = percent + '%';

                    const response = await fetch(url);
                    if (!response.ok) throw new Error();
                    const arrayBuffer = await response.arrayBuffer();
                    const decodedBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                    buffers.push(decodedBuffer);
                }

                const mergedBuffer = mergeBuffers(buffers, 0.1);
                const currentBlob = bufferToWav(mergedBuffer);
                mainAudio.src = URL.createObjectURL(currentBlob);
                
                playerBox.classList.remove('hidden');
                statusBox.style.display = 'none';
            } catch (err) {
                console.error(err);
            } finally {
                mergeBtn.disabled = false;
            }
        };

        function mergeBuffers(buffers, overlapSec) {
            const sampleRate = buffers[0].sampleRate;
            const overlap = Math.floor(overlapSec * sampleRate);
            let totalLength = buffers.reduce((acc, b) => acc + b.length, 0) - (buffers.length - 1) * overlap;
            const output = audioCtx.createBuffer(buffers[0].numberOfChannels, totalLength, sampleRate);

            for (let ch = 0; ch < output.numberOfChannels; ch++) {
                const outData = output.getChannelData(ch);
                let offset = 0;
                buffers.forEach((b, i) => {
                    const bData = b.getChannelData(ch);
                    for (let j = 0; j < bData.length; j++) {
                        if (i > 0 && j < overlap) {
                            const weight = j / overlap;
                            outData[offset - overlap + j] = (outData[offset - overlap + j] * (1 - weight)) + (bData[j] * weight);
                        } else {
                            outData[offset + (i > 0 ? j - overlap : j)] = bData[j];
                        }
                    }
                    offset += bData.length - (i < buffers.length - 1 ? overlap : 0);
                });
            }
            return output;
        }

        function bufferToWav(abuffer) {
            let n = abuffer.numberOfChannels, len = abuffer.length * n * 2 + 44,
                buf = new ArrayBuffer(len), view = new DataView(buf),
                ch = [], i, s, off = 0, p = 0;
            const u16 = (d) => { view.setUint16(p, d, true); p += 2; };
            const u32 = (d) => { view.setUint32(p, d, true); p += 4; };
            u32(0x46464952); u32(len - 8); u32(0x45564157); u32(0x20746d66);
            u32(16); u16(1); u16(n); u32(abuffer.sampleRate); u32(abuffer.sampleRate * 2 * n);
            u16(n * 2); u16(16); u32(0x61746164); u32(len - p - 4);
            for (i = 0; i < n; i++) ch.push(abuffer.getChannelData(i));
            while (p < len) {
                for (i = 0; i < n; i++) {
                    s = Math.max(-1, Math.min(1, ch[i][off]));
                    s = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    view.setInt16(p, s, true); p += 2;
                }
                off++;
            }
            return new Blob([buf], { type: 'audio/wav' });
        }

        init();
    </script>
</body>
</html>
