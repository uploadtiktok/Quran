```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل آيات القرآن الكريم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        .verse-container { min-height: 200px; display: flex; align-items: center; justify-content: center; background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .progress-bar { transition: width 0.3s ease; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-3xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800 mb-2">صانع فيديوهات الآيات</h1>
            <p class="text-slate-600">اختر السورة والآيات ثم قم بتصدير الفيديو</p>
        </header>

        <div class="bg-white p-6 rounded-2xl shadow-sm mb-6 border border-slate-200">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">اسم السورة</label>
                    <select id="surahNum" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none"></select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">من الآية</label>
                    <input type="number" id="fromVerse" value="1" min="1" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">إلى الآية</label>
                    <input type="number" id="toVerse" value="5" min="1" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
            </div>
            <div class="flex flex-col sm:flex-row gap-4">
                <button onclick="startPresentation()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-emerald-200">
                    تشغيل العرض
                </button>
                <button id="exportBtn" onclick="exportVideo()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-blue-200">
                    تحميل فيديو MP4
                </button>
            </div>
        </div>

        <div id="exportProgress" class="hidden mb-6 bg-white p-4 rounded-xl border border-blue-200 shadow-sm">
            <div class="text-blue-700 text-sm mb-2 font-bold" id="progressStatus">جاري التحضير...</div>
            <div class="w-full bg-blue-100 rounded-full h-2.5">
                <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full progress-bar" style="width: 0%"></div>
            </div>
        </div>

        <div id="displayArea" class="hidden">
            <div class="verse-container p-8 mb-4">
                <img id="verseImage" src="" alt="آية قرآنية" class="max-w-full h-auto">
            </div>
            <div class="flex flex-col items-center gap-4">
                <audio id="audioPlayer" controls class="w-full"></audio>
                <div class="text-slate-500 text-sm" id="statusText"></div>
            </div>
        </div>
    </div>

    <script>
        const surahNames = ["الفاتحة", "البقرة", "آل عمران", "النساء", "المائدة", "الأنعام", "الأعراف", "الأنفال", "التوبة", "يونس", "هود", "يوسف", "الرعد", "إبراهيم", "الحجر", "النحل", "الإسراء", "الكهف", "مريم", "طه", "الأنبياء", "الحج", "المؤمنون", "النور", "الفرقان", "الشعراء", "النمل", "القصص", "العنكبوت", "الروم", "لقمان", "السجدة", "الأحزاب", "سبأ", "فاطر", "يس", "الصافات", "ص", "الزمر", "غافر", "فصلت", "الشورى", "الزخرف", "الدخان", "الجاثية", "الأحقاف", "محمد", "الفتح", "الحجرات", "ق", "الذاريات", "الطور", "النجم", "القمر", "الرحمن", "الواقعة", "الحديد", "المجادلة", "الحشر", "الممتحنة", "الصف", "الجمعة", "المنافقون", "التغابن", "الطلاق", "التحريم", "الملك", "القلم", "الحاقة", "المعارج", "نوح", "الجن", "المزمل", "المدثر", "القيامة", "الإنسان", "المرسلات", "النبأ", "النازعات", "عبس", "التكوير", "الانفطار", "المطففين", "الانشقاق", "البروج", "الطارق", "الأعلى", "الغاشية", "الفجر", "البلد", "الشمس", "الليل", "الضحى", "الشرح", "التين", "العلق", "القدر", "البينة", "الزلزلة", "العاديات", "القارعة", "التكاثر", "العصر", "الهمزة", "الفيل", "قريش", "الماعون", "الكوثر", "الكافرون", "النصر", "المسد", "الإخلاص", "الفلق", "الناس"];

        const select = document.getElementById('surahNum');
        surahNames.forEach((name, index) => {
            const option = document.createElement('option');
            option.value = index + 1;
            option.text = `${index + 1}. ${name}`;
            select.appendChild(option);
        });

        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({
            log: true,
            corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
        });

        let currentVerse = 0;
        let versesList = [];
        const audioPlayer = document.getElementById('audioPlayer');
        const verseImage = document.getElementById('verseImage');
        const statusText = document.getElementById('statusText');

        function startPresentation() {
            const surah = select.value;
            const from = parseInt(document.getElementById('fromVerse').value);
            const to = parseInt(document.getElementById('toVerse').value);

            versesList = [];
            for (let v = from; v <= to; v++) {
                const sPad = surah.padStart(3, '0');
                const vPad = v.toString().padStart(3, '0');
                versesList.push({
                    number: v,
                    audio: `https://www.everyayah.com/data/Yasser_Ad-Dussary_128kbps/${sPad}${vPad}.mp3`,
                    image: `https://legacy.quran.com/images/ayat_retina/${surah}_${v}.png`
                });
            }
            currentVerse = 0;
            document.getElementById('displayArea').classList.remove('hidden');
            playVerse(currentVerse);
        }

        function playVerse(index) {
            if (index >= versesList.length) { statusText.innerText = "اكتملت القراءة"; return; }
            const verse = versesList[index];
            statusText.innerText = `جاري تشغيل الآية رقم ${verse.number}`;
            verseImage.src = verse.image;
            audioPlayer.src = verse.audio;
            audioPlayer.play();
        }

        audioPlayer.onended = () => { currentVerse++; playVerse(currentVerse); };

        async function exportVideo() {
            const btn = document.getElementById('exportBtn');
            const progress = document.getElementById('exportProgress');
            const bar = document.getElementById('progressBar');
            const status = document.getElementById('progressStatus');
            
            btn.disabled = true;
            progress.classList.remove('hidden');
            
            try {
                if (!ffmpeg.isLoaded()) {
                    status.innerText = "جاري تحميل محرك الفيديو...";
                    await ffmpeg.load();
                }

                const surah = select.value;
                const from = parseInt(document.getElementById('fromVerse').value);
                const to = parseInt(document.getElementById('toVerse').value);
                let total = to - from + 1;
                let concatText = "";

                for (let i = 0; i < total; i++) {
                    const v = from + i;
                    status.innerText = `جاري جلب الآية ${v}...`;
                    const sPad = surah.padStart(3, '0');
                    const vPad = v.toString().padStart(3, '0');
                    
                    const audioUrl = `https://www.everyayah.com/data/Yasser_Ad-Dussary_128kbps/${sPad}${vPad}.mp3`;
                    const imageUrl = `https://legacy.quran.com/images/ayat_retina/${surah}_${v}.png`;

                    const audioBlob = await fetch(audioUrl).then(r => r.blob());
                    const audioData = await audioBlob.arrayBuffer();
                    const imageData = await fetch(imageUrl).then(r => r.arrayBuffer());

                    const tempAudio = new Audio();
                    tempAudio.src = URL.createObjectURL(audioBlob);
                    await new Promise(r => tempAudio.onloadedmetadata = r);
                    const duration = tempAudio.duration;

                    ffmpeg.FS('writeFile', `a${i}.mp3`, new Uint8Array(audioData));
                    ffmpeg.FS('writeFile', `i${i}.png`, new Uint8Array(imageData));
                    
                    status.innerText = `جاري إنشاء المقطع ${v}...`;
                    await ffmpeg.run('-loop', '1', '-t', duration.toString(), '-i', `i${i}.png`, '-i', `a${i}.mp3`, '-c:v', 'libx264', '-t', duration.toString(), '-pix_fmt', 'yuv420p', '-vf', 'scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2:white', `v${i}.mp4`);
                    
                    concatText += `file v${i}.mp4\n`;
                    bar.style.width = `${((i + 1) / total) * 80}%`;
                }

                ffmpeg.FS('writeFile', 'list.txt', concatText);
                status.innerText = "جاري الدمج النهائي...";

                await ffmpeg.run('-f', 'concat', '-safe', '0', '-i', 'list.txt', '-c', 'copy', 'final.mp4');

                const data = ffmpeg.FS('readFile', 'final.mp4');
                const url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
                const a = document.createElement('a');
                a.href = url;
                a.download = `Quran_${surahNames[surah-1]}_${from}-${to}.mp4`;
                a.click();
                
                status.innerText = "تم التصدير بنجاح!";
                bar.style.width = "100%";
            } catch (e) {
                console.error(e);
                status.innerText = "خطأ في التصدير. يرجى تجربة متصفح حديث.";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
